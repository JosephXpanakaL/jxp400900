<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">Animated music and technology visual</title><desc id="desc">A glowing piano keyboard with animated equalizer bars and floating musical notes.</desc>
<defs><linearGradient id="bg"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#172554"/><stop offset="1" stop-color="#083344"/></linearGradient><linearGradient id="glow"><stop stop-color="#60a5fa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="8"/></filter></defs>
<style>.bar{transform-origin:center 198px;animation:pulse 1.4s ease-in-out infinite alternate}.b2{animation-delay:-.25s}.b3{animation-delay:-.55s}.b4{animation-delay:-.8s}.b5{animation-delay:-1.05s}.note{animation:float 4s ease-in-out infinite}.n2{animation-delay:-1.3s}.n3{animation-delay:-2.7s}.key{animation:keyGlow 3s ease-in-out infinite}.k2{animation-delay:-1s}.k3{animation-delay:-2s}@keyframes pulse{from{transform:scaleY(.3);opacity:.55}to{transform:scaleY(1);opacity:1}}@keyframes float{0%,100%{transform:translateY(8px);opacity:.45}50%{transform:translateY(-12px);opacity:1}}@keyframes keyGlow{0%,100%{fill:#e2e8f0}50%{fill:#67e8f9}}</style>
<rect width="900" height="260" rx="28" fill="url(#bg)"/><ellipse cx="450" cy="195" rx="330" ry="32" fill="#22d3ee" opacity=".18" filter="url(#blur)"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#93c5fd">WHERE MUSIC MEETS CODE</text>
<g fill="url(#glow)"><rect class="bar b2" x="340" y="88" width="12" height="80" rx="6"/><rect class="bar b4" x="362" y="68" width="12" height="100" rx="6"/><rect class="bar b3" x="384" y="105" width="12" height="63" rx="6"/><rect class="bar b5" x="406" y="78" width="12" height="90" rx="6"/><rect class="bar" x="428" y="55" width="12" height="113" rx="6"/><rect class="bar b3" x="450" y="92" width="12" height="76" rx="6"/><rect class="bar b5" x="472" y="72" width="12" height="96" rx="6"/><rect class="bar b2" x="494" y="100" width="12" height="68" rx="6"/><rect class="bar b4" x="516" y="82" width="12" height="86" rx="6"/><rect class="bar b3" x="538" y="110" width="12" height="58" rx="6"/></g>
<g font-family="serif" font-weight="700" fill="#67e8f9"><text class="note" x="190" y="92" font-size="42">♫</text><text class="note n2" x="690" y="105" font-size="34">♪</text><text class="note n3" x="748" y="62" font-size="27">♫</text></g>
<g transform="translate(120 178)"><rect width="660" height="58" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><g stroke="#64748b"><path class="key" fill="#e2e8f0" d="M8 7h42v44H8z"/><path fill="#e2e8f0" d="M50 7h42v44H50z"/><path class="key k2" fill="#e2e8f0" d="M92 7h42v44H92z"/><path fill="#e2e8f0" d="M134 7h42v44h-42z"/><path class="key k3" fill="#e2e8f0" d="M176 7h42v44h-42z"/><path fill="#e2e8f0" d="M218 7h42v44h-42z"/><path class="key" fill="#e2e8f0" d="M260 7h42v44h-42z"/><path fill="#e2e8f0" d="M302 7h42v44h-42z"/><path class="key k2" fill="#e2e8f0" d="M344 7h42v44h-42z"/><path fill="#e2e8f0" d="M386 7h42v44h-42z"/><path class="key k3" fill="#e2e8f0" d="M428 7h42v44h-42z"/><path fill="#e2e8f0" d="M470 7h42v44h-42z"/><path class="key" fill="#e2e8f0" d="M512 7h42v44h-42z"/><path fill="#e2e8f0" d="M554 7h42v44h-42z"/><path class="key k2" fill="#e2e8f0" d="M596 7h56v44h-56z"/></g><g fill="#111827"><rect x="37" y="7" width="24" height="28" rx="2"/><rect x="79" y="7" width="24" height="28" rx="2"/><rect x="163" y="7" width="24" height="28" rx="2"/><rect x="205" y="7" width="24" height="28" rx="2"/><rect x="247" y="7" width="24" height="28" rx="2"/><rect x="331" y="7" width="24" height="28" rx="2"/><rect x="373" y="7" width="24" height="28" rx="2"/><rect x="457" y="7" width="24" height="28" rx="2"/><rect x="499" y="7" width="24" height="28" rx="2"/><rect x="541" y="7" width="24" height="28" rx="2"/></g></g></svg>
