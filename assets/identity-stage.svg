<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Joseph X Panakal animated identity constellation</title>
  <desc id="desc">A layered animated scene connecting faith, music, data and youth around Joseph.</desc>
  <defs>
    <radialGradient id="back" cx="50%" cy="44%" r="70%"><stop offset="0" stop-color="#172554"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#050b16"/></radialGradient>
    <linearGradient id="name" x1="0" x2="1"><stop stop-color="#93c5fd"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#2563eb" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <filter id="halo"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .star{animation:twinkle 2.8s ease-in-out infinite alternate}.s2{animation-delay:-.8s}.s3{animation-delay:-1.7s}.ring{transform-origin:450px 223px;animation:turn 24s linear infinite}.ring2{transform-origin:450px 223px;animation:turnBack 34s linear infinite}.float{animation:float 4.5s ease-in-out infinite}.f2{animation-delay:-1.1s}.f3{animation-delay:-2.2s}.f4{animation-delay:-3.3s}.pulse{animation:pulse 2.6s ease-in-out infinite}.scan{animation:scan 4s ease-in-out infinite}.wave{transform-origin:center bottom;animation:wave 1.4s ease-in-out infinite alternate}.w2{animation-delay:-.3s}.w3{animation-delay:-.6s}.w4{animation-delay:-.9s}@keyframes twinkle{from{opacity:.15}to{opacity:.9}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes turnBack{to{transform:rotate(-360deg)}}@keyframes float{0%,100%{transform:translateY(7px)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:.8;transform:scale(1.04)}}@keyframes scan{0%,100%{transform:translateX(-230px);opacity:0}45%,55%{opacity:.8}50%{transform:translateX(230px)}}@keyframes wave{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  </style>
  <rect width="900" height="460" rx="30" fill="url(#back)"/>
  <g fill="#7dd3fc"><circle class="star" cx="90" cy="82" r="2"/><circle class="star s2" cx="760" cy="75" r="2.5"/><circle class="star s3" cx="820" cy="320" r="2"/><circle class="star s2" cx="125" cy="365" r="2.5"/><circle class="star s3" cx="245" cy="55" r="1.8"/><circle class="star" cx="680" cy="390" r="1.8"/></g>
  <circle cx="450" cy="223" r="145" fill="#0ea5e9" opacity=".08" filter="url(#halo)"/>
  <g class="ring" fill="none" stroke="#38bdf8" stroke-opacity=".28"><ellipse cx="450" cy="223" rx="315" ry="130" stroke-dasharray="7 14"/><circle cx="765" cy="223" r="7" fill="#67e8f9" stroke="none"/></g>
  <g class="ring2" fill="none" stroke="#a78bfa" stroke-opacity=".25"><ellipse cx="450" cy="223" rx="220" ry="185" stroke-dasharray="4 18"/><circle cx="450" cy="38" r="6" fill="#c4b5fd" stroke="none"/></g>
  <g class="float" transform="translate(70 120)"><rect width="175" height="66" rx="18" fill="#0f2445" stroke="#3b82f6"/><text x="87" y="29" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="3" fill="#93c5fd">PURPOSE</text><text x="87" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">FAITH</text></g>
  <g class="float f2" transform="translate(655 112)"><rect width="175" height="66" rx="18" fill="#12213f" stroke="#8b5cf6"/><text x="87" y="29" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="3" fill="#c4b5fd">EXPRESSION</text><text x="87" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">MUSIC</text></g>
  <g class="float f3" transform="translate(70 292)"><rect width="175" height="66" rx="18" fill="#0d2833" stroke="#06b6d4"/><text x="87" y="29" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="3" fill="#67e8f9">POSSIBILITY</text><text x="87" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">DATA + CODE</text></g>
  <g class="float f4" transform="translate(655 292)"><rect width="175" height="66" rx="18" fill="#102544" stroke="#3b82f6"/><text x="87" y="29" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="3" fill="#93c5fd">SERVICE</text><text x="87" y="50" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">YOUTH</text></g>
  <g text-anchor="middle" font-family="Arial,sans-serif"><text x="450" y="182" font-size="15" letter-spacing="7" fill="#7dd3fc">HELLO, I AM</text><text x="450" y="232" font-size="42" font-weight="800" fill="url(#name)">JOSEPH</text><text x="450" y="261" font-size="14" letter-spacing="3" fill="#cbd5e1">SALESIAN · MUSICIAN · DATA EXPLORER</text><text x="450" y="292" font-size="12" letter-spacing="2" fill="#64748b">BUILDING THINGS THAT MATTER</text></g>
  <rect class="pulse" x="334" y="313" width="232" height="2" rx="1" fill="url(#line)"/>
  <g fill="#22d3ee" transform="translate(401 332)"><rect class="wave" x="0" y="0" width="7" height="35" rx="3"/><rect class="wave w2" x="14" y="0" width="7" height="35" rx="3"/><rect class="wave w3" x="28" y="0" width="7" height="35" rx="3"/><rect class="wave w4" x="42" y="0" width="7" height="35" rx="3"/><rect class="wave w2" x="56" y="0" width="7" height="35" rx="3"/><rect class="wave w3" x="70" y="0" width="7" height="35" rx="3"/><rect class="wave" x="84" y="0" width="7" height="35" rx="3"/></g>
  <rect class="scan" x="425" y="90" width="50" height="270" fill="#67e8f9" opacity=".08" filter="url(#soft)"/>
</svg>
